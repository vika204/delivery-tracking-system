name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and contract verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install shared modules
        run: |
          mvn -B -f tracking-api/pom.xml install -DskipTests
          mvn -B -f tracking-grpc-client/pom.xml install
          mvn -B -f web-problems/pom.xml install

      # Consumers regenerate the pacts they own before providers verify them; Testcontainers uses the runner's Docker.
      - name: Test services (consumer pacts first, then provider verification)
        run: |
          for module in web-ui tracking-service notification-service dispatch-service shipment-service auth-service; do
            echo "::group::$module"
            mvn -B -f "$module/pom.xml" verify
            echo "::endgroup::"
          done

      - name: Committed pacts match the consumer tests
        run: git diff --exit-code -- pacts/

      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: '*/target/site/jacoco/'

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: |
          for module in auth-service shipment-service dispatch-service tracking-service notification-service web-ui; do
            docker build -f "$module/Dockerfile" -t "delivery/$module:ci" .
          done
