spring.application.name=tracking-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

shipment.client.base-url=${SHIPMENT_SERVICE_URL:http://localhost:8082}

# Circuit Breaker
resilience4j.circuitbreaker.instances.shipmentClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.shipmentClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.shipmentClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.shipmentClient.wait-duration-in-open-state=10s

# Retry
resilience4j.retry.instances.shipmentClient.max-attempts=3
resilience4j.retry.instances.shipmentClient.wait-duration=500ms
resilience4j.retry.instances.shipmentClient.enable-exponential-backoff=true
resilience4j.retry.instances.shipmentClient.exponential-backoff-multiplier=2
resilience4j.retry.instances.shipmentClient.enable-randomized-wait=true
resilience4j.retry.instances.shipmentClient.randomized-wait-factor=0.5

#?? ???? ???? ???????? ?? ?????????? ????????? ????????? ?????
resilience4j.retry.instances.shipmentClient.retry-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.shipmentClient.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException

# Semaphore Bulkhead
resilience4j.bulkhead.instances.shipmentClient.max-concurrent-calls=20
resilience4j.bulkhead.instances.shipmentClient.max-wait-duration=0

# Resilience4j aspect order
resilience4j.bulkhead.bulkheadAspectOrder=1
resilience4j.circuitbreaker.circuitBreakerAspectOrder=2
resilience4j.retry.retryAspectOrder=3

#4xx ??????? ?? ??????? ???????? ?? ???? Circuit Breaker, ???? ?? ?? ?????????
resilience4j.circuitbreaker.instances.shipmentClient.ignore-exceptions[0]=org.springframework.web.client.HttpClientErrorException