spring.application.name=tracking-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

shipment.client.base-url=${SHIPMENT_SERVICE_URL:http://localhost:8082}

# Circuit Breaker
resilience4j.circuitbreaker.instances.shipmentClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.shipmentClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.shipmentClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.shipmentClient.wait-duration-in-open-state=10s

# Retry
resilience4j.retry.instances.shipmentClient.max-attempts=3
resilience4j.retry.instances.shipmentClient.wait-duration=500ms
resilience4j.retry.instances.shipmentClient.enable-exponential-backoff=true
resilience4j.retry.instances.shipmentClient.exponential-backoff-multiplier=2
resilience4j.retry.instances.shipmentClient.enable-randomized-wait=true
resilience4j.retry.instances.shipmentClient.randomized-wait-factor=0.5

#?? ???? ???? ???????? ?? ?????????? ????????? ????????? ?????
resilience4j.retry.instances.shipmentClient.retry-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.shipmentClient.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException

# Semaphore Bulkhead
resilience4j.bulkhead.instances.shipmentClient.max-concurrent-calls=20
resilience4j.bulkhead.instances.shipmentClient.max-wait-duration=0

# Resilience4j aspect order
resilience4j.bulkhead.bulkheadAspectOrder=1
resilience4j.circuitbreaker.circuitBreakerAspectOrder=2
resilience4j.retry.retryAspectOrder=3

#4xx
resilience4j.circuitbreaker.instances.shipmentClient.ignore-exceptions[0]=org.springframework.web.client.HttpClientErrorException

# Distributed tracing
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# OTLP trace export
management.tracing.export.otlp.enabled=${OTLP_TRACES_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Metrics are collected by Prometheus
management.otlp.metrics.export.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# gRPC server
spring.grpc.server.port=${GRPC_SERVER_PORT:9090}

# Enable reflection only for local testing when needed
spring.grpc.server.reflection.enabled=${GRPC_REFLECTION_ENABLED:false}

# Time zone used to interpret Location.recordedAt
tracking.recorded-at-zone=${TRACKING_RECORDED_AT_ZONE:UTC}

# Shipment status changes via Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

tracking.location-history.enabled=${TRACKING_LOCATION_HISTORY_ENABLED:false}