spring.application.name=notification-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

app.kafka.retry.attempts=${APP_KAFKA_RETRY_ATTEMPTS:4}
app.kafka.retry.delay-ms=${APP_KAFKA_RETRY_DELAY_MS:1000}
app.kafka.retry.multiplier=${APP_KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-delay-ms=${APP_KAFKA_RETRY_MAX_DELAY_MS:10000}

# Distributed tracing
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# Kafka tracing: traceparent header is injected by producer and extracted by listener
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

# OTLP trace export
management.tracing.export.otlp.enabled=${OTLP_TRACES_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Metrics are collected by Prometheus
management.otlp.metrics.export.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# gRPC client
spring.grpc.client.channel.tracking.target=${TRACKING_GRPC_TARGET:dns:///localhost:9094}

# gRPC Server Streaming reconnection
tracking.grpc.reconnect.initial-delay-ms=1000
tracking.grpc.reconnect.max-delay-ms=10000
tracking.grpc.reconnect.multiplier=2.0
# gRPC Unary retries (service config) для GetShipmentDeliveryInfo.
# Повторюється лише UNAVAILABLE: tracking-service тимчасово недоступний або сам
# повернув UNAVAILABLE (недоступна його БД чи shipment-service). Затримка перед
# спробою N вибирається випадково з [0, min(initial-backoff * multiplier^(N-2), max-backoff)].
# На Server Streaming (SubscribeToShipmentLocations) ця політика не впливає.
# timeout - загальний deadline разом з усіма retries. Він має бути більшим за час однієї спроби:
# tracking-service сам повторює запит до shipment-service (resilience4j), тож одна спроба може тривати секунди.
spring.grpc.client.channel.tracking.service-config.method[0].name[0].service=delivery.tracking.v1.ShipmentTrackingService
spring.grpc.client.channel.tracking.service-config.method[0].name[0].method=GetShipmentDeliveryInfo
spring.grpc.client.channel.tracking.service-config.method[0].timeout=${TRACKING_GRPC_UNARY_TIMEOUT:30s}
spring.grpc.client.channel.tracking.service-config.method[0].retry.max-attempts=${TRACKING_GRPC_RETRY_MAX_ATTEMPTS:5}
spring.grpc.client.channel.tracking.service-config.method[0].retry.initial-backoff=${TRACKING_GRPC_RETRY_INITIAL_BACKOFF:500ms}
spring.grpc.client.channel.tracking.service-config.method[0].retry.max-backoff=${TRACKING_GRPC_RETRY_MAX_BACKOFF:4s}
spring.grpc.client.channel.tracking.service-config.method[0].retry.backoff-multiplier=2.0
spring.grpc.client.channel.tracking.service-config.method[0].retry.retryable-status-codes=UNAVAILABLE

# Retry throttling (token bucket): кожна невдала спроба -1 токен, успіх +0.1;
# retries дозволені, поки токенів > max-tokens/2 (тобто ~50 збоїв поспіль),
# це захищає tracking-service від шторму повторів під час тривалої аварії.
spring.grpc.client.channel.tracking.service-config.retrythrottling.max-tokens=100
spring.grpc.client.channel.tracking.service-config.retrythrottling.token-ratio=0.1
