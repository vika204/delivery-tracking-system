spring.application.name=notification-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

app.kafka.retry.attempts=${APP_KAFKA_RETRY_ATTEMPTS:4}
app.kafka.retry.delay-ms=${APP_KAFKA_RETRY_DELAY_MS:1000}
app.kafka.retry.multiplier=${APP_KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-delay-ms=${APP_KAFKA_RETRY_MAX_DELAY_MS:10000}

# Distributed tracing
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# Kafka tracing: traceparent header is injected by producer and extracted by listener
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

# OTLP trace export
management.tracing.export.otlp.enabled=${OTLP_TRACES_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Metrics are collected by Prometheus
management.otlp.metrics.export.enabled=false