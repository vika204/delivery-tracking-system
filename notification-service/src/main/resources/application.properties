spring.application.name=notification-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Consumer
# Значення читається як сирі байти, а в ShipmentCreatedEvent його перетворює RecordMessageConverter.
# Так зіпсований JSON не блокує poll(), а потрапляє в DLT у незмінному вигляді.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Producer (пересилання записів у retry-топіки та DLT)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Ретраї обробки shipment.events
app.kafka.retry.attempts=${APP_KAFKA_RETRY_ATTEMPTS:4}
app.kafka.retry.delay-ms=${APP_KAFKA_RETRY_DELAY_MS:1000}
app.kafka.retry.multiplier=${APP_KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-delay-ms=${APP_KAFKA_RETRY_MAX_DELAY_MS:10000}
