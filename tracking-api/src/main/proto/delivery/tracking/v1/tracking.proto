syntax = "proto3";

package delivery.tracking.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.delivery.tracking.grpc";
option java_multiple_files = true;
option java_outer_classname = "TrackingProto";

service ShipmentTrackingService {

  rpc SubscribeToShipmentLocations(SubscribeToShipmentLocationsRequest)
      returns (stream ShipmentLocationUpdate);

  rpc GetShipmentDeliveryInfo(GetShipmentDeliveryInfoRequest)
      returns (ShipmentDeliveryInfo);

  rpc RecordShipmentRoute(stream ShipmentRoutePoint)
      returns (ShipmentRouteSummary);

  rpc StreamCourierLocations(stream CourierLocationReport)
      returns (stream CourierLocationDecision);

}

message SubscribeToShipmentLocationsRequest {
  int64 shipment_id = 1;
}

message ShipmentLocationUpdate {
  int64 location_id = 1;
  int64 shipment_id = 2;
  double latitude = 3;
  double longitude = 4;
  google.protobuf.Timestamp recorded_at = 5;
}

message GetShipmentDeliveryInfoRequest {
  int64 shipment_id = 1;
}

message ShipmentDeliveryInfo {
  int64 shipment_id = 1;
  string status = 2;
  bool has_location = 3;
  double latitude = 4;
  double longitude = 5;
  google.protobuf.Timestamp recorded_at = 6;
}

message ShipmentRoutePoint {
  string upload_id = 1;
  int64 shipment_id = 2;
  double latitude = 3;
  double longitude = 4;
  google.protobuf.Timestamp recorded_at = 5;
}

message ShipmentRouteSummary {
  string upload_id = 1;
  int64 shipment_id = 2;
  int32 received_count = 3;
  int32 saved_count = 4;
  int32 rejected_count = 5;
  int64 first_location_id = 6;
  int64 last_location_id = 7;
  bool duplicate = 8;
}

enum CourierLocationStatus {
  COURIER_LOCATION_STATUS_UNSPECIFIED = 0;
  COURIER_LOCATION_STATUS_ACCEPTED = 1;
  COURIER_LOCATION_STATUS_REJECTED = 2;
  COURIER_LOCATION_STATUS_SUSPICIOUS_JUMP = 3;
}

message CourierLocationReport {
  string point_id = 1;
  int64 shipment_id = 2;
  double latitude = 3;
  double longitude = 4;
  google.protobuf.Timestamp recorded_at = 5;
}

message CourierLocationDecision {
  string point_id = 1;
  int64 shipment_id = 2;
  CourierLocationStatus status = 3;
  bool saved = 4;
  int64 location_id = 5;
  string reason = 6;
  double distance_meters = 7;
  double speed_kmh = 8;
  bool duplicate = 9;
}
