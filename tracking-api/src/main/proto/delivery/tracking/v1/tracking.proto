syntax = "proto3";

package delivery.tracking.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.delivery.tracking.grpc";
option java_multiple_files = true;
option java_outer_classname = "TrackingProto";

service ShipmentTrackingService {

  rpc SubscribeToShipmentLocations(SubscribeToShipmentLocationsRequest)
      returns (stream ShipmentLocationUpdate);

}

message SubscribeToShipmentLocationsRequest {
  int64 shipment_id = 1;
}

message ShipmentLocationUpdate {
  int64 location_id = 1;
  int64 shipment_id = 2;
  double latitude = 3;
  double longitude = 4;
  google.protobuf.Timestamp recorded_at = 5;
}
