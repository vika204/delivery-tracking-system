apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: delivery
  labels:
    app: tracking-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h tracking-db -p 5432; do echo waiting for tracking-db; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        - name: tracking-service
          image: tracking-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: tracking-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tracking-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracking-db-secret
                  key: POSTGRES_PASSWORD
            - name: SHIPMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: tracking-config
                  key: SHIPMENT_SERVICE_URL

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true

---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: delivery
  labels:
    app: tracking-service
spec:
  type: ClusterIP
  selector:
    app: tracking-service
  ports:
    - name: http
      port: 8080
      targetPort: http
