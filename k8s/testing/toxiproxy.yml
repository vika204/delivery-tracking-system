apiVersion: v1
kind: ConfigMap
metadata:
  name: toxiproxy-config
  namespace: delivery
data:
  proxies.json: |
    [
      {
        "name": "shipment",
        "listen": "0.0.0.0:8666",
        "upstream": "shipment-service:8080",
        "enabled": true
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        app: toxiproxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.13.0
          args: ["-host=0.0.0.0", "-config=/config/proxies.json"]
          ports:
            - name: api
              containerPort: 8474
            - name: shipment
              containerPort: 8666
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /proxies/shipment
              port: api
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /version
              port: api
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: toxiproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: delivery
spec:
  selector:
    app: toxiproxy
  ports:
    - name: api
      port: 8474
      targetPort: api
    - name: shipment
      port: 8666
      targetPort: shipment
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tracking-to-toxiproxy
  namespace: delivery
spec:
  podSelector:
    matchLabels:
      app: toxiproxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tracking-service
      ports:
        - protocol: TCP
          port: 8666
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-toxiproxy-to-shipment
  namespace: delivery
spec:
  podSelector:
    matchLabels:
      app: shipment-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: toxiproxy
      ports:
        - protocol: TCP
          port: 8080
