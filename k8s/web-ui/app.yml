apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: delivery
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-ui
          image: web-ui:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: SERVER_PORT}}
            - name: AUTH_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: AUTH_SERVICE_URL}}
            - name: SHIPMENT_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: SHIPMENT_SERVICE_URL}}
            - name: DISPATCH_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: DISPATCH_SERVICE_URL}}
            - name: TRACKING_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: TRACKING_SERVICE_URL}}
            - name: NOTIFICATION_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: NOTIFICATION_SERVICE_URL}}
            - name: TRACKING_GRPC_TARGET
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: TRACKING_GRPC_TARGET}}
            - name: TRACKING_GRPC_TLS_ENABLED
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: TRACKING_GRPC_TLS_ENABLED}}
            - name: TRACKING_STREAM_ENABLED
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: TRACKING_STREAM_ENABLED}}
            - name: DISPATCH_COURIER_LOOKUP_ENABLED
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: DISPATCH_COURIER_LOOKUP_ENABLED}}
            - name: WEB_LOCAL_DEV_LOOPBACK_ONLY
              valueFrom: {configMapKeyRef: {name: web-ui-config, key: WEB_LOCAL_DEV_LOOPBACK_ONLY}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: delivery
spec:
  type: ClusterIP
  selector:
    app: web-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
