apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: delivery
data:
  alertmanager.yml: |
    route:
      receiver: telegram
      group_by: [alertname, app]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h

    receivers:
      - name: telegram
        webhook_configs:
          - url: http://telegram-alert-bridge.delivery.svc:8080/alert
            send_resolved: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534

      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager

          ports:
            - containerPort: 9093
              name: web

          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: storage
              mountPath: /alertmanager

      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: delivery
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: web
