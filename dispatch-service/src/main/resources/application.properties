spring.application.name=dispatch-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Local-development-only courier lookup. This is not authorization.
dispatch.courier-lookup.enabled=${DISPATCH_COURIER_LOOKUP_ENABLED:false}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Distributed tracing
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# OTLP trace export
management.tracing.export.otlp.enabled=${OTLP_TRACES_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Metrics are collected by Prometheus
management.otlp.metrics.export.enabled=false

management.metrics.distribution.percentiles-histogram.http.server.requests=true

# gRPC client -> tracking-service
spring.grpc.client.channel.tracking.target=${TRACKING_GRPC_TARGET:dns:///localhost:9094}

# gRPC Client Streaming retries (service config) для RecordShipmentRoute.
# Повторюється лише UNAVAILABLE. gRPC буферизує надіслані координати й відправляє
# увесь потік повторно в новій спробі; дублікатів немає завдяки upload_id на сервері.
# Затримка перед спробою N вибирається випадково з [0, min(initial-backoff * multiplier^(N-2), max-backoff)].
spring.grpc.client.channel.tracking.service-config.method[0].name[0].service=delivery.tracking.v1.ShipmentTrackingService
spring.grpc.client.channel.tracking.service-config.method[0].name[0].method=RecordShipmentRoute
spring.grpc.client.channel.tracking.service-config.method[0].timeout=${TRACKING_GRPC_STREAM_TIMEOUT:30s}
spring.grpc.client.channel.tracking.service-config.method[0].retry.max-attempts=${TRACKING_GRPC_RETRY_MAX_ATTEMPTS:5}
spring.grpc.client.channel.tracking.service-config.method[0].retry.initial-backoff=${TRACKING_GRPC_RETRY_INITIAL_BACKOFF:500ms}
spring.grpc.client.channel.tracking.service-config.method[0].retry.max-backoff=${TRACKING_GRPC_RETRY_MAX_BACKOFF:4s}
spring.grpc.client.channel.tracking.service-config.method[0].retry.backoff-multiplier=2.0
spring.grpc.client.channel.tracking.service-config.method[0].retry.retryable-status-codes=UNAVAILABLE

# Retry throttling (token bucket): кожна невдала спроба -1 токен, успіх +0.1;
# retries дозволені, поки токенів > max-tokens/2 (тобто ~50 збоїв поспіль),
# це захищає tracking-service від шторму повторів під час тривалої аварії.
spring.grpc.client.channel.tracking.service-config.retrythrottling.max-tokens=100
spring.grpc.client.channel.tracking.service-config.retrythrottling.token-ratio=0.1

# Max points in one route upload (must not exceed server limit of 1000)
dispatch.route-upload.max-points=1000
