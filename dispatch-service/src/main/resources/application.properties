spring.application.name=dispatch-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Local-development-only courier lookup. This is not authorization.
dispatch.courier-lookup.enabled=${DISPATCH_COURIER_LOOKUP_ENABLED:false}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Distributed tracing
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# OTLP trace export
management.tracing.export.otlp.enabled=${OTLP_TRACES_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Metrics are collected by Prometheus
management.otlp.metrics.export.enabled=false

management.metrics.distribution.percentiles-histogram.http.server.requests=true

# gRPC client -> tracking-service (однаковий блок в усіх клієнтах tracking-service)
tracking.grpc.deadline=${TRACKING_GRPC_DEADLINE:30s}
tracking.grpc.retry.max-attempts=${TRACKING_GRPC_RETRY_MAX_ATTEMPTS:5}
tracking.grpc.retry.initial-backoff=${TRACKING_GRPC_RETRY_INITIAL_BACKOFF:500ms}
tracking.grpc.retry.max-backoff=${TRACKING_GRPC_RETRY_MAX_BACKOFF:4s}
tracking.grpc.retry.backoff-multiplier=2.0

spring.grpc.client.channel.tracking.target=${TRACKING_GRPC_TARGET:dns:///localhost:9094}
spring.grpc.client.channel.tracking.service-config.method[0].name[0].service=delivery.tracking.v1.ShipmentTrackingService
spring.grpc.client.channel.tracking.service-config.method[0].retry.max-attempts=${tracking.grpc.retry.max-attempts}
spring.grpc.client.channel.tracking.service-config.method[0].retry.initial-backoff=${tracking.grpc.retry.initial-backoff}
spring.grpc.client.channel.tracking.service-config.method[0].retry.max-backoff=${tracking.grpc.retry.max-backoff}
spring.grpc.client.channel.tracking.service-config.method[0].retry.backoff-multiplier=${tracking.grpc.retry.backoff-multiplier}
spring.grpc.client.channel.tracking.service-config.method[0].retry.retryable-status-codes=UNAVAILABLE
spring.grpc.client.channel.tracking.service-config.retrythrottling.max-tokens=100
spring.grpc.client.channel.tracking.service-config.retrythrottling.token-ratio=0.1

# Kafka: Shipment events in, dispatch.events out (outbox)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true
outbox.relay.delay-ms=${OUTBOX_RELAY_DELAY_MS:1000}

# Courier search and offers
dispatch.offer-ttl=${DISPATCH_OFFER_TTL:60s}
dispatch.max-active-assignments=${DISPATCH_MAX_ACTIVE_ASSIGNMENTS:3}
dispatch.location-max-age=${DISPATCH_LOCATION_MAX_AGE:15m}
dispatch.queue-batch-size=${DISPATCH_QUEUE_BATCH_SIZE:20}
dispatch.search-delay-threshold=${DISPATCH_SEARCH_DELAY_THRESHOLD:2m}
dispatch.scheduling.expiry-check-interval=${DISPATCH_EXPIRY_CHECK_INTERVAL:5s}
dispatch.scheduling.retry-interval=${DISPATCH_RETRY_INTERVAL:30s}
