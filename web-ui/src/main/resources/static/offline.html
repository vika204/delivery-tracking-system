<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7d6c2">
  <title>Service unavailable | WEB EXPRESS</title>
  <link rel="icon" type="image/svg+xml" href="/images/spider-icon.svg">
  <script defer src="/js/components/offline.js"></script>
  <style>
    :root {
      --paper: #e7d6c2;
      --cream: #f6e6cf;
      --red: #bc2c1d;
      --ink: #16110e;
      --gold: #edb43d;
      --gold-light: #ffe4a1;
      --shadow: #26150f;
      --font-display: 'Anton', Impact, 'Arial Narrow', sans-serif;
      --font-condensed: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
      font-family: var(--font-condensed);
    }
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 9;
        opacity: 0.045;
        pointer-events: none;

        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23000' filter='url(%23n)' d='M0 0h140v140H0z'/%3E%3C/svg%3E");
    }
    .page {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 38px 35px 34px;
      isolation: isolate;
      overflow: hidden;
    }
    .unavailable-message {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 0 18px;
      text-align: center;
      font: 400 clamp(24px, 4vw, 34px)/1.15 var(--font-display);
    }
    .stage {
      position: relative;
      width: min(480px, calc(100vw - 84px));
      flex: none;
      padding: 23px 0 13px;
      transform: scale(.9);
      transform-origin: center top;
      margin-bottom: -45px;
    }
    .slot-machine {
      position: relative;
      width: 100%;
      filter: drop-shadow(8px 11px 0 rgba(39, 23, 16, .95));
    }
    .marquee {
      position: relative;
      z-index: 2;
      width: 88%;
      height: 131px;
      margin: 0 auto -13px;
      border: 5px solid var(--ink);
      border-radius: 53% 53% 17px 17px / 86% 86% 14px 14px;
      background: var(--red);
      box-shadow: inset 0 0 0 6px var(--gold), inset 0 0 0 10px var(--ink), inset 0 0 0 14px #d94f32;
      overflow: hidden;
    }
    .marquee::after {
      content: "";
      position: absolute;
      inset: 21px 35px 15px;
      border: 1px solid rgba(255, 222, 164, .43);
      border-radius: 54% 54% 12px 12px / 100% 100% 12px 12px;
      pointer-events: none;
    }
    .marquee-stars {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 19px;
      height: 100%;
      padding-top: 18px;
      color: var(--gold-light);
      filter: drop-shadow(2px 3px 0 var(--ink));
    }
    .marquee-stars svg { height: auto; width: 49px; fill: currentColor; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
    .marquee-stars svg:nth-child(2) { width: 74px; transform: translateY(-9px); }
    .marquee-stars svg:nth-child(1) { transform: rotate(-15deg) translateY(8px); }
    .marquee-stars svg:nth-child(3) { transform: rotate(15deg) translateY(8px); }
    .cabinet {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 30px 27px 28px;
      border: 5px solid var(--ink);
      border-radius: 25px 25px 50px 50px;
      background: var(--red);
      box-shadow: inset 7px 0 0 rgba(255, 209, 157, .20), inset -8px 0 0 #922117;
    }
    .cabinet::before, .cabinet::after {
      content: "";
      position: absolute;
      top: 34px;
      bottom: 28px;
      width: 5px;
      border-radius: 3px;
      background: var(--gold);
      opacity: .95;
    }
    .cabinet::before { left: 10px; }
    .cabinet::after { right: 10px; }
    .screen-shell {
      position: relative;
      border: 5px solid var(--ink);
      border-radius: 23px;
      padding: 14px 13px;
      background: var(--gold);
      box-shadow: 4px 5px 0 rgba(30, 16, 11, .55), inset 0 0 0 3px rgba(255, 244, 212, .7);
    }
    .screen-shell::before, .screen-shell::after {
      content: "";
      position: absolute;
      top: 50%;
      z-index: 4;
      width: 9px;
      height: 30px;
      transform: translateY(-50%);
      background: var(--red);
      border: 2px solid var(--ink);
    }
    .screen-shell::before { left: -10px; border-radius: 0 4px 4px 0; }
    .screen-shell::after { right: -10px; border-radius: 4px 0 0 4px; }
    .reels {
      position: relative;
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 3px solid var(--ink);
      border-radius: 13px;
      background: #241b16;
    }
    .reels::before, .reels::after {
      content: "";
      position: absolute;
      left: 9px;
      right: 9px;
      height: 2px;
      background: rgba(51, 26, 17, .75);
      z-index: 5;
      pointer-events: none;
    }
    .reels::before { top: 26%; }
    .reels::after { bottom: 26%; }
    .reel {
      position: relative;
      min-width: 0;
      width: 33.333%;
      height: 185px;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: #f8ebd7;
      isolation: isolate;
    }
    .reel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(52, 30, 16, .23), transparent 26%, transparent 69%, rgba(52, 30, 16, .26)), linear-gradient(90deg, rgba(129, 87, 48, .07), transparent 28%, rgba(255, 255, 255, .32) 65%, rgba(129, 87, 48, .10));
      box-shadow: inset 0 0 8px rgba(31, 14, 10, .22);
    }
    .reel-track { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }
    .symbol {
      height: 112px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .symbol-art { display: block; width: 88%; max-width: 104px; height: 94px; overflow: visible; }
    .symbol--lemon .symbol-art, .symbol--cherry .symbol-art { filter: drop-shadow(1px 3px 0 rgba(41, 18, 13, .12)); }
    .seven {
      font: 400 clamp(29px, 6.2vw, 66px)/1 var(--font-display);
      letter-spacing: -.065em;
      color: #c8291c;
      -webkit-text-stroke: 1.5px #251710;
      text-shadow: 2px 3px 0 #f2bc37;
      padding-right: .1em;
      white-space: nowrap;
    }
    .bar {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 93%;
      min-height: 53px;
      padding: 0 3px 1px;
      border: 3px solid #29160e;
      border-radius: 5px;
      background: #231914;
      color: #ffe2a6;
      box-shadow: inset 0 0 0 2px #f8d88b, 2px 3px 0 rgba(23, 12, 8, .18);
      font: 400 clamp(22px, 5.2vw, 49px)/1 var(--font-display);
      letter-spacing: .06em;
    }
    .bar::before, .bar::after {
      content: "";
      height: 3px;
      background: var(--red);
      flex: 1;
      margin: 0 2px;
      min-width: 3px;
    }
    .win-line {
      position: absolute;
      top: 50%;
      left: -1px;
      right: -1px;
      z-index: 4;
      height: 118px;
      pointer-events: none;
      transform: translateY(-50%);
      border-top: 1px solid rgba(219, 74, 32, .35);
      border-bottom: 1px solid rgba(219, 74, 32, .35);
    }
    .panel-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 22px 12px 20px;
      gap: 12px;
    }
    .bolts { display: flex; gap: 9px; }
    .bolt {
      width: 16px;
      height: 16px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: #f7cf72;
      box-shadow: inset -2px -2px rgba(164, 99, 28, .28);
      position: relative;
    }
    .bolt::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 5px;
      width: 7px;
      height: 2px;
      background: var(--ink);
      transform: rotate(-35deg);
    }
    .lights { display: flex; gap: 10px; }
    .light { width: 12px; height: 12px; border-radius: 50%; background: #f5c766; border: 2px solid var(--ink); }
    .light:nth-child(2) { background: #f7e9c7; }
    .slot-machine.is-spinning .light { animation: blink .42s steps(2, start) infinite; }
    .slot-machine.is-spinning .light:nth-child(2) { animation-delay: .14s; }
    .slot-machine.is-spinning .light:nth-child(3) { animation-delay: .28s; }
    @keyframes blink { to { background: #ffefaf; box-shadow: 0 0 13px #ffda75; } }
    .spin-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(255px, 83%);
      min-height: 61px;
      margin: 0 auto;
      padding: 8px 28px 10px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--cream);
      color: var(--ink);
      box-shadow: 4px 5px 0 var(--shadow);
      font: 800 27px/1 var(--font-condensed);
      letter-spacing: .055em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      touch-action: manipulation;
    }
    .spin-button:hover:not(:disabled) { background: #fff2db; box-shadow: 4px 7px 0 var(--shadow); transform: translateY(-2px); }
    .spin-button:active:not(:disabled) { box-shadow: 2px 2px 0 var(--shadow); transform: translate(2px, 3px); }
    .spin-button:focus-visible { outline: 3px solid #fff1bf; outline-offset: 5px; }
    .spin-button:disabled { opacity: .85; cursor: default; }
    .base-neck {
      width: 86%;
      height: 25px;
      margin: -1px auto 0;
      border: 5px solid var(--ink);
      border-top: none;
      border-radius: 0 0 16px 16px;
      background: #99271c;
    }
    .base-foot {
      width: 97%;
      height: 28px;
      margin: -1px auto 0;
      border: 5px solid var(--ink);
      border-radius: 14px 14px 9px 9px;
      background: var(--gold);
      box-shadow: inset 0 5px 0 rgba(255, 238, 177, .72);
    }
    .lever {
      position: absolute;
      z-index: -1;
      right: -31px;
      top: 218px;
      width: 44px;
      height: 138px;
      transform-origin: 13px 103px;
    }
    .lever-base {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 38px;
      height: 52px;
      border: 4px solid var(--ink);
      border-radius: 12px 18px 18px 12px;
      background: var(--gold);
    }
    .lever-stick {
      position: absolute;
      bottom: 30px;
      left: 13px;
      width: 13px;
      height: 90px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: #f4dfb3;
      transform: rotate(9deg);
      transform-origin: center bottom;
    }
    .lever-ball {
      position: absolute;
      top: 1px;
      left: 2px;
      width: 36px;
      height: 36px;
      border: 4px solid var(--ink);
      border-radius: 50%;
      background: var(--red);
      box-shadow: inset 5px 5px 0 #e44d35;
    }
    .slot-machine.is-spinning .lever { animation: lever-pull .52s ease-in-out; }
    @keyframes lever-pull { 0%, 100% { transform: rotate(0); } 45% { transform: rotate(25deg) translateY(13px); } }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 560px) {
      .page { padding: 20px 35px 22px; }
      .stage { width: min(420px, calc(100vw - 66px)); padding-top: 8px; }
      .marquee { height: 105px; margin-bottom: -10px; border-width: 4px; }
      .marquee-stars { gap: 12px; padding-top: 15px; }
      .marquee-stars svg { width: 33px; }
      .marquee-stars svg:nth-child(2) { width: 55px; }
      .cabinet { padding: 23px 15px 22px; border-width: 4px; border-radius: 21px 21px 35px 35px; }
      .cabinet::before { left: 6px; }
      .cabinet::after { right: 6px; }
      .screen-shell { padding: 8px 7px; border-width: 4px; border-radius: 15px; }
      .reels { gap: 5px; padding: 5px; border-width: 2px; }
      .reel { height: 155px; border-width: 1.5px; }
      .symbol { height: 98px; }
      .symbol-art { height: 78px; }
      .win-line { height: 98px; }
      .seven { -webkit-text-stroke: 1.1px #251710; font-size: clamp(33px, 10vw, 48px); text-shadow: 1px 2px 0 #f2bc37; }
      .bar { min-height: 39px; font-size: clamp(21px, 5.8vw, 35px); border-width: 2px; box-shadow: inset 0 0 0 1px #f8d88b; }
      .panel-details { margin: 16px 8px 14px; }
      .spin-button { min-height: 54px; width: min(227px, 83%); font-size: 24px; }
      .lever { top: 161px; right: -28px; transform: scale(.85); transform-origin: 0 100%; }
      .base-neck { height: 21px; }
      .base-foot { height: 24px; }
    }
    @media (max-width: 360px) {
      .stage { width: calc(100vw - 63px); }
      .cabinet { padding-left: 12px; padding-right: 12px; }
      .reel { height: 145px; }
      .symbol { height: 94px; }
      .win-line { height: 94px; }
      .symbol-art { height: 74px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page" aria-labelledby="unavailable-title">
    <h1 class="unavailable-message" id="unavailable-title">SERVER TEMPORARILY UNAVAILABLE</h1>

    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;overflow:hidden">
      <defs>
        <symbol id="star-symbol" viewBox="0 0 100 100">
          <path d="M50 6 62.3 34.7 94 37.3 69.9 57.9 77.1 89 50 72.5 22.9 89 30.1 57.9 6 37.3 37.7 34.7Z"/>
        </symbol>
        <symbol id="lemon-symbol" viewBox="0 0 120 110">
          <path d="M70 26Q77 10 94 9Q90 27 73 33" fill="#42724b" stroke="#22170e" stroke-width="4" stroke-linejoin="round"/>
          <path d="M72 27 76 13" stroke="#22170e" stroke-width="4" stroke-linecap="round"/>
          <path d="M19 58Q6 55 10 48Q17 41 25 44C38 21 73 16 93 33Q107 44 100 60Q110 65 107 72Q103 79 93 76Q74 94 48 88Q25 84 19 58Z" fill="#f6bf2e" stroke="#231610" stroke-width="5" stroke-linejoin="round"/>
          <path d="M29 49Q45 26 72 31" fill="none" stroke="#ffe69b" stroke-width="8" stroke-linecap="round"/>
          <path d="M30 67Q42 82 62 81" stroke="#d68a21" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M85 39Q94 44 96 52" stroke="#e69f24" stroke-width="4" fill="none" stroke-linecap="round"/>
        </symbol>
        <symbol id="cherry-symbol" viewBox="0 0 120 110">
          <path d="M39 57Q54 19 73 13Q82 21 90 57" fill="none" stroke="#2c2714" stroke-width="5" stroke-linecap="round"/>
          <path d="M51 30Q34 17 30 14Q56 11 70 24" fill="#42794b" stroke="#23170f" stroke-width="4" stroke-linejoin="round"/>
          <path d="M66 20Q81 4 100 12Q95 27 72 27" fill="#53905a" stroke="#23170f" stroke-width="4" stroke-linejoin="round"/>
          <path d="M60 72C60 88 50 99 36 99C18 99 10 87 11 73C12 58 24 50 37 50C50 50 60 58 60 72Z" fill="#d63429" stroke="#231610" stroke-width="5"/>
          <path d="M109 75C109 91 97 101 83 101C68 101 58 91 58 76C58 60 69 52 83 52C98 52 109 60 109 75Z" fill="#bb211f" stroke="#231610" stroke-width="5"/>
          <path d="M22 68Q26 60 35 60" stroke="#ff9380" stroke-width="6" stroke-linecap="round"/>
          <path d="M72 69Q75 61 84 61" stroke="#f87066" stroke-width="6" stroke-linecap="round"/>
        </symbol>
      </defs>
    </svg>

    <div class="stage">

      <div class="slot-machine" id="machine">
        <div class="marquee" aria-hidden="true">
          <div class="marquee-stars">
            <svg viewBox="0 0 100 100"><use href="#star-symbol"/></svg>
            <svg viewBox="0 0 100 100"><use href="#star-symbol"/></svg>
            <svg viewBox="0 0 100 100"><use href="#star-symbol"/></svg>
          </div>
        </div>
        <div class="cabinet">
          <div class="screen-shell">
            <div class="reels" id="reels" role="img" aria-label="Three reels with lemon, cherry, 777 and BAR symbols">
              <div class="reel"><div class="reel-track"></div><div class="win-line"></div></div>
              <div class="reel"><div class="reel-track"></div><div class="win-line"></div></div>
              <div class="reel"><div class="reel-track"></div><div class="win-line"></div></div>
            </div>
          </div>
          <div class="panel-details" aria-hidden="true">
            <div class="bolts"><i class="bolt"></i><i class="bolt"></i></div>
            <div class="lights"><i class="light"></i><i class="light"></i><i class="light"></i></div>
            <div class="bolts"><i class="bolt"></i><i class="bolt"></i></div>
          </div>
          <button class="spin-button" id="spin" type="button">SPIN</button>
        </div>
        <div class="base-neck" aria-hidden="true"></div>
        <div class="base-foot" aria-hidden="true"></div>
        <div class="lever" aria-hidden="true"><span class="lever-base"></span><span class="lever-stick"></span><span class="lever-ball"></span></div>
      </div>
    </div>
    <p class="sr-only" id="announcement" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      const choices = ['lemon', 'cherry', 'seven', 'bar'];
      const names = { lemon: 'lemon', cherry: 'cherry', seven: '777', bar: 'BAR' };
      const tracks = Array.from(document.querySelectorAll('.reel-track'));
      const reels = Array.from(document.querySelectorAll('.reel'));
      const button = document.getElementById('spin');
      const machine = document.getElementById('machine');
      const announcement = document.getElementById('announcement');
      const shown = ['cherry', 'lemon', 'seven'];
      const random = () => choices[Math.floor(Math.random() * choices.length)];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function symbolHtml(kind) {
        if (kind === 'lemon' || kind === 'cherry') {
          return `<div class="symbol symbol--${kind}"><svg class="symbol-art" viewBox="0 0 120 110" aria-hidden="true"><use href="#${kind}-symbol"></use></svg></div>`;
        }
        if (kind === 'seven') return '<div class="symbol symbol--seven"><span class="seven">777</span></div>';
        return '<div class="symbol symbol--bar"><span class="bar">BAR</span></div>';
      }

      function position(track, reel, index) {
        const item = track.querySelector('.symbol');
        const itemHeight = item.offsetHeight;
        const viewHeight = reel.offsetHeight;
        return (viewHeight - itemHeight) / 2 - index * itemHeight;
      }

      function displayInitial() {
        tracks.forEach((track, index) => {
          const items = [random(), random(), shown[index], random(), random()];
          track.innerHTML = items.map(symbolHtml).join('');
          track.style.transition = 'none';
          track.style.transform = `translateY(${position(track, reels[index], 2)}px)`;
        });
      }

      button.addEventListener('click', () => {
        if (button.disabled) return;
        button.disabled = true;
        machine.classList.add('is-spinning');
        announcement.textContent = 'Reels are spinning';
        const duration = reducedMotion.matches ? 100 : 1850;
        tracks.forEach((track, index) => {
          const goal = random();
          const stopIndex = 26 + index * 3;
          const sequence = [random(), random(), shown[index]];
          while (sequence.length < stopIndex) sequence.push(random());
          sequence.push(goal, random(), random());
          track.innerHTML = sequence.map(symbolHtml).join('');
          track.style.transition = 'none';
          track.style.transform = `translateY(${position(track, reels[index], 2)}px)`;
          track.getBoundingClientRect();
          const time = duration + (reducedMotion.matches ? 0 : index * 350);
          requestAnimationFrame(() => {
            track.style.transition = `transform ${time}ms cubic-bezier(.16,.72,.15,1)`;
            track.style.transform = `translateY(${position(track, reels[index], stopIndex)}px)`;
          });
          shown[index] = goal;
        });
        window.setTimeout(() => {
          machine.classList.remove('is-spinning');
          button.disabled = false;
          announcement.textContent = `Result: ${shown.map(kind => names[kind]).join(', ')}`;
        }, duration + (reducedMotion.matches ? 0 : 2 * 350) + 75);
      });

      window.addEventListener('resize', () => { if (!button.disabled) displayInitial(); });
      displayInitial();
    })();
  </script>
</body>
</html>
