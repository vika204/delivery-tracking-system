spring.application.name=web-ui
server.port=8086
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
tracking.client.base-url=${TRACKING_SERVICE_URL:http://localhost:8084}
dispatch.client.base-url=${DISPATCH_SERVICE_URL:http://localhost:8083}
shipment.client.base-url=${SHIPMENT_SERVICE_URL:http://localhost:8082}
notification.client.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
auth.client.base-url=${AUTH_SERVICE_URL:http://localhost:8081}

spring.http.clients.imperative.factory=jdk
spring.http.serviceclient.shipment.base-url=${shipment.client.base-url}
spring.http.serviceclient.shipment.connect-timeout=2s
spring.http.serviceclient.shipment.read-timeout=3s
spring.http.serviceclient.shipment-creation.base-url=${shipment.client.base-url}
spring.http.serviceclient.shipment-creation.connect-timeout=2s
spring.http.serviceclient.shipment-creation.read-timeout=20s
spring.http.serviceclient.dispatch.base-url=${dispatch.client.base-url}
spring.http.serviceclient.dispatch.connect-timeout=2s
spring.http.serviceclient.dispatch.read-timeout=3s
spring.http.serviceclient.tracking.base-url=${tracking.client.base-url}
spring.http.serviceclient.tracking.connect-timeout=2s
spring.http.serviceclient.tracking.read-timeout=3s
spring.http.serviceclient.notification.base-url=${notification.client.base-url}
spring.http.serviceclient.notification.connect-timeout=2s
spring.http.serviceclient.notification.read-timeout=3s
spring.http.serviceclient.auth.base-url=${auth.client.base-url}
spring.http.serviceclient.auth.connect-timeout=2s
spring.http.serviceclient.auth.read-timeout=3s

dispatch.courier-lookup.enabled=${DISPATCH_COURIER_LOOKUP_ENABLED:false}

dispatch.courier-dashboard.enabled=${DISPATCH_COURIER_DASHBOARD_ENABLED:false}
dispatch.courier-dashboard.courier-id=${DISPATCH_COURIER_DASHBOARD_COURIER_ID:1}

tracking.stream.enabled=${TRACKING_STREAM_ENABLED:false}
tracking.stream.timeout=${TRACKING_STREAM_TIMEOUT:5m}
tracking.stream.heartbeat=${TRACKING_STREAM_HEARTBEAT:15s}

spring.grpc.client.channel.tracking.target=${TRACKING_GRPC_TARGET:dns:///localhost:9094}
spring.grpc.client.channel.tracking.ssl.enabled=${TRACKING_GRPC_TLS_ENABLED:false}

shipment.creation.enabled=${SHIPMENT_CREATION_ENABLED:false}
shipment.creation.sender-id=${SHIPMENT_CREATION_SENDER_ID:42}

rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.capacity=${RATE_LIMIT_CAPACITY:60}
rate-limit.window=${RATE_LIMIT_WINDOW:1m}
