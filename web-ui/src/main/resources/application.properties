spring.application.name=web-ui
server.port=8086
spring.thymeleaf.cache=false
tracking.client.base-url=${TRACKING_SERVICE_URL:http://localhost:8084}
dispatch.client.base-url=${DISPATCH_SERVICE_URL:http://localhost:8083}

# Local-development-only courier lookup. This is not authorization.
dispatch.courier-lookup.enabled=${DISPATCH_COURIER_LOOKUP_ENABLED:false}

# Local-development-only GPS stream. This is not user authorization.
tracking.stream.enabled=${TRACKING_STREAM_ENABLED:false}
tracking.stream.timeout=${TRACKING_STREAM_TIMEOUT:5m}
tracking.stream.heartbeat=${TRACKING_STREAM_HEARTBEAT:15s}

# Host access uses 9094; containers inside Docker use tracking-service:9090.
spring.grpc.client.channel.tracking.target=${TRACKING_GRPC_TARGET:dns:///localhost:9094}
# Plaintext is the local default for this channel only. Enable TLS per environment.
spring.grpc.client.channel.tracking.ssl.enabled=${TRACKING_GRPC_TLS_ENABLED:false}
