<header class="site-header"
        th:fragment="siteHeader(headerState)"
        th:with="state=${headerState == null ? 'GUEST' : headerState},
                 currentPage=${activePage == null ? '' : activePage}"
        xmlns:th="http://www.thymeleaf.org">

    <nav class="site-header__nav" aria-label="Main navigation">
        <a class="site-header__brand" th:href="@{/}">
            WEB EXPRESS
        </a>

        <span class="site-header__divider" aria-hidden="true"></span>

        <th:block th:if="${state == 'GUEST'}">
            <a th:href="@{/tracking}"
               th:classappend="${currentPage == 'tracking'} ? 'active' : ''">
                TRACK
            </a>
            <a th:href="@{/login}">LOG IN</a>
            <a class="site-header__signup" th:href="@{/register}">SIGN UP</a>
        </th:block>

        <th:block th:if="${state == 'CLIENT'}">
            <a class="site-header__desktop-only"
               th:href="@{/ship}"
               th:classappend="${currentPage == 'ship'} ? 'active' : ''">
                SHIP
            </a>
            <a class="site-header__desktop-only"
               th:href="@{/my-parcels}"
               th:classappend="${currentPage == 'my-parcels'} ? 'active' : ''">
                MY PARCELS
            </a>
            <a th:href="@{/tracking(previewRole='CLIENT')}"
               th:classappend="${currentPage == 'tracking'} ? 'active' : ''">
                TRACK
            </a>

            <div class="site-header__profile" data-profile-menu>
                <button class="site-header__profile-button"
                        th:classappend="${currentPage == 'profile'} ? 'active' : ''"
                        type="button"
                        aria-label="Open profile menu"
                        aria-expanded="false"
                        aria-controls="profile-menu"
                        data-profile-menu-button>
                    <img class="site-header__profile-icon"
                         th:src="@{/images/spider-icon.svg}"
                         src="/images/spider-icon.svg"
                         width="18"
                         height="18"
                         alt=""
                         aria-hidden="true">
                    <span class="site-header__profile-label">PROFILE</span>
                </button>

                <div class="site-header__menu"
                     id="profile-menu"
                     role="menu"
                     data-profile-menu-panel
                     hidden>
                    <a class="site-header__mobile-only"
                       role="menuitem"
                       th:href="@{/ship}"
                       th:classappend="${currentPage == 'ship'} ? 'active' : ''">
                        SHIP
                    </a>
                    <a class="site-header__mobile-only"
                       role="menuitem"
                       th:href="@{/my-parcels}"
                       th:classappend="${currentPage == 'my-parcels'} ? 'active' : ''">
                        MY PARCELS
                    </a>
                    <a role="menuitem"
                       th:href="@{/profile}"
                       th:classappend="${currentPage == 'profile'} ? 'active' : ''">
                        MY PROFILE
                    </a>
                    <button type="button" role="menuitem">LOG OUT</button>
                </div>
            </div>
        </th:block>

        <th:block th:if="${state == 'COURIER'}">
            <a class="site-header__desktop-only"
               th:href="@{/courier/dashboard}"
               th:classappend="${currentPage == 'courier-dashboard'} ? 'active' : ''">
                DASHBOARD
            </a>

            <div class="site-header__profile" data-profile-menu>
                <button class="site-header__profile-button"
                        th:classappend="${currentPage == 'courier-profile'} ? 'active' : ''"
                        type="button"
                        aria-label="Open profile menu"
                        aria-expanded="false"
                        aria-controls="courier-profile-menu"
                        data-profile-menu-button>
                    <img class="site-header__profile-icon"
                         th:src="@{/images/spider-icon.svg}"
                         src="/images/spider-icon.svg"
                         width="18"
                         height="18"
                         alt=""
                         aria-hidden="true">
                    <span class="site-header__profile-label">PROFILE</span>
                </button>

                <div class="site-header__menu"
                     id="courier-profile-menu"
                     role="menu"
                     data-profile-menu-panel
                     hidden>
                    <a class="site-header__mobile-only"
                       role="menuitem"
                       th:href="@{/courier/dashboard}"
                       th:classappend="${currentPage == 'courier-dashboard'} ? 'active' : ''">
                        DASHBOARD
                    </a>
                    <a role="menuitem"
                       th:href="@{/courier/profile}"
                       th:classappend="${currentPage == 'courier-profile'} ? 'active' : ''">
                        MY PROFILE
                    </a>
                    <button type="button" role="menuitem">LOG OUT</button>
                </div>
            </div>
        </th:block>
    </nav>
</header>
