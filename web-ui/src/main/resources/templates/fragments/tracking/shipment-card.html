<aside class="tracking-card"
       th:fragment="shipmentCard"
       aria-label="Shipment details"
       xmlns:th="http://www.thymeleaf.org">
    <dl class="tracking-card__fields">
        <div class="tracking-card__field tracking-card__field--shipment">
            <dt>SHIPMENT</dt>
            <dd th:text="' #' + ${tracking.trackingNumber}"> #15</dd>
        </div>

        <div class="tracking-card__field tracking-card__field--status">
            <dt>STATUS</dt>
            <dd id="delivery-status"
                role="status"
                aria-live="polite"
                th:text="${tracking.statusText}">IN TRANSIT</dd>
        </div>

        <div class="tracking-card__field">
            <dt>DESTINATION</dt>
            <dd th:text="${tracking.destinationText}">Not available</dd>
        </div>

        <div class="tracking-card__field">
            <dt>COURIER</dt>
            <dd th:text="${tracking.courierText}">Not available</dd>
        </div>
    </dl>
</aside>
