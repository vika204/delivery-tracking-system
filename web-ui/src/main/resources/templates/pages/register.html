<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join the web — WEB EXPRESS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/spider-icon.svg}">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/components/header.css}">
    <link rel="stylesheet" th:href="@{/css/components/cursor-webs.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/katottg-autocomplete.css}">
    <link rel="stylesheet" th:href="@{/css/pages/register.css}">
    <script defer th:src="@{/js/components/header.js}"></script>
    <script defer th:src="@{/js/components/cursor-webs.js}"></script>
    <script type="module" th:src="@{/js/pages/register.js}"></script>
</head>
<body>
<canvas id="cursor-webs" aria-hidden="true"></canvas>

<header th:replace="~{fragments/header :: siteHeader(headerState=${headerState})}"></header>

<main class="registration-page">
    <aside class="visual" aria-label="Web Express courier illustration">
        <div class="hanger" role="button" tabindex="0"
             aria-label="Gently swing the courier" title="Give me a little swing">
            <img th:src="@{/images/registration-spider.png}"
                 alt="Spider courier hanging upside down on a web with an EXPRESS package">
        </div>
        <p class="visual-note">YOUR FRIENDLY NEIGHBORHOOD DELIVERY.</p>
    </aside>

    <section class="form-area" id="registration-form-area" aria-labelledby="register-title">
        <div class="registration-tabs" role="tablist" aria-label="Choose account type">
            <button class="registration-tab active"
                    id="client-tab"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="client-registration"
                    data-registration-tab="client">
                CLIENT
            </button>
            <button class="registration-tab"
                    id="courier-tab"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    aria-controls="courier-registration"
                    tabindex="-1"
                    data-registration-tab="courier">
                COURIER
            </button>
        </div>

        <div class="title-frame">
            <h1 id="register-title">
                <span id="register-title-first">CREATE</span>
                <span id="register-title-second">ACCOUNT.</span>
            </h1>
        </div>

        <div id="client-registration"
             role="tabpanel"
             aria-labelledby="client-tab"
             data-registration-panel="client">
            <!-- Design preview only: Keycloak will handle real registration. -->
            <form id="client-register"
                  action="#"
                  data-auth-form
                  data-registration-role="client"
                  data-prototype-message="This is a design preview. Client registration will be available after Keycloak integration.">
                <div class="field">
                    <label for="client-email">EMAIL ADDRESS</label>
                    <input id="client-email" type="email" autocomplete="email"
                           placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="client-password">PASSWORD</label>
                    <div class="password">
                        <input id="client-password" type="password"
                               autocomplete="new-password" minlength="8"
                               placeholder="Create a password" required
                               data-password>
                        <button class="show" type="button" aria-label="Show password"
                                aria-pressed="false">SHOW</button>
                    </div>
                    <p class="hint">At least 8 characters.</p>
                </div>

                <div class="field">
                    <label for="client-confirm-password">CONFIRM PASSWORD</label>
                    <div class="password">
                        <input id="client-confirm-password" type="password"
                               autocomplete="new-password" minlength="8"
                               placeholder="Confirm your password" required
                               data-confirm-password>
                        <button class="show" type="button" aria-label="Show confirmed password"
                                aria-pressed="false">SHOW</button>
                    </div>
                </div>

                <button class="cta web-button" type="submit">
                    <th:block th:replace="~{fragments/ui/button-webs :: buttonWebs}"></th:block>
                    <span class="web-button__label">CREATE CLIENT ACCOUNT</span>
                </button>

                <p class="footer-note">Already have an account?
                    <a th:href="@{/login}">Log in</a>
                </p>
                <p class="status" role="status" aria-live="polite"></p>
            </form>
        </div>

        <div id="courier-registration"
             role="tabpanel"
             aria-labelledby="courier-tab"
             data-registration-panel="courier"
             hidden>
            <!-- Design preview only: Keycloak will handle real registration. -->
            <form id="courier-register"
                  action="#"
                  data-auth-form
                  data-registration-role="courier"
                  data-prototype-message="This is a design preview. Courier registration will be available after Keycloak integration.">
                <div class="field">
                    <label for="courier-full-name">FULL NAME</label>
                    <input id="courier-full-name" type="text" autocomplete="name"
                           placeholder="e.g. Andrii Kovalenko" maxlength="140" required>
                </div>

                <div class="field">
                    <label for="courier-email">EMAIL ADDRESS</label>
                    <input id="courier-email" type="email" autocomplete="email"
                           placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="courier-phone">PHONE NUMBER</label>
                    <input id="courier-phone" type="tel" autocomplete="tel"
                           placeholder="+380 XX XXX XX XX" maxlength="25"
                           pattern="[+0-9() .-]{7,25}" required>
                </div>

                <div class="field katottg-field">
                    <label for="courier-work-zone">WORK ZONE</label>
                    <input id="courier-work-zone" type="text" autocomplete="off"
                           placeholder="Enter city or village..." maxlength="100"
                           aria-autocomplete="list"
                           aria-controls="courier-work-zone-suggestions"
                           aria-expanded="false" required>
                    <input id="courier-work-zone-code" type="hidden">
                    <div id="courier-work-zone-suggestions"
                         class="katottg-suggestions"
                         role="listbox"
                         aria-label="Courier work zone settlements"
                         hidden></div>
                    <p id="courier-work-zone-help" class="katottg-help">
                        Choose a settlement from the official KATOTTG list.
                    </p>
                </div>

                <div class="field">
                    <label for="courier-max-weight">MAX PACKAGE WEIGHT</label>
                    <div class="weight-field">
                        <input id="courier-max-weight" type="number"
                               min="1" max="1000" step="1" inputmode="numeric"
                               placeholder="20" required>
                        <span aria-hidden="true">KG</span>
                    </div>
                </div>

                <div class="field">
                    <label for="courier-password">PASSWORD</label>
                    <div class="password">
                        <input id="courier-password" type="password"
                               autocomplete="new-password" minlength="8"
                               placeholder="Create a password" required
                               data-password>
                        <button class="show" type="button" aria-label="Show password"
                                aria-pressed="false">SHOW</button>
                    </div>
                    <p class="hint">At least 8 characters.</p>
                </div>

                <div class="field">
                    <label for="courier-confirm-password">CONFIRM PASSWORD</label>
                    <div class="password">
                        <input id="courier-confirm-password" type="password"
                               autocomplete="new-password" minlength="8"
                               placeholder="Confirm your password" required
                               data-confirm-password>
                        <button class="show" type="button" aria-label="Show confirmed password"
                                aria-pressed="false">SHOW</button>
                    </div>
                </div>

                <button class="cta web-button" type="submit">
                    <th:block th:replace="~{fragments/ui/button-webs :: buttonWebs}"></th:block>
                    <span class="web-button__label">CREATE COURIER ACCOUNT</span>
                </button>

                <p class="footer-note">Already have an account?
                    <a th:href="@{/login}">Log in</a>
                </p>
                <p class="status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </section>
</main>
</body>
</html>
