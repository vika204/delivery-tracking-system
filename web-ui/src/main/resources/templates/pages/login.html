<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome back — WEB EXPRESS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/spider-icon.svg}">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/components/header.css}">
    <link rel="stylesheet" th:href="@{/css/components/cursor-webs.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/pages/register.css}">
    <script defer th:src="@{/js/components/header.js}"></script>
    <script defer th:src="@{/js/components/cursor-webs.js}"></script>
    <script type="module" th:src="@{/js/pages/register.js}"></script>
</head>
<body>
<canvas id="cursor-webs" aria-hidden="true"></canvas>

<header th:replace="~{fragments/header :: siteHeader(headerState=${headerState})}"></header>

<main class="registration-page">
    <aside class="visual" aria-label="Web Express courier illustration">
        <div class="hanger" role="button" tabindex="0"
             aria-label="Gently swing the courier" title="Give me a little swing">
            <img th:src="@{/images/registration-spider.png}"
                 alt="Spider courier hanging upside down on a web with an EXPRESS package">
        </div>
        <p class="visual-note">YOUR FRIENDLY NEIGHBORHOOD DELIVERY.</p>
    </aside>

    <section class="form-area" aria-labelledby="login-title">
        <div class="title-frame">
            <h1 id="login-title"><span>WELCOME</span> <span>BACK.</span></h1>
        </div>

        <!-- Design preview only: Keycloak will handle real authentication. -->
        <form id="login"
              action="#"
              data-auth-form
              data-prototype-message="This is a design preview. Login will be available after Keycloak integration.">
            <div class="field">
                <label for="email">EMAIL ADDRESS</label>
                <input id="email" type="email" autocomplete="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="password">PASSWORD</label>
                <div class="password">
                    <input id="password" type="password"
                           autocomplete="current-password"
                           placeholder="Enter your password" required>
                    <button class="show" type="button" aria-label="Show password"
                            aria-pressed="false">SHOW</button>
                </div>
            </div>

            <button class="cta web-button" type="submit">
                <th:block th:replace="~{fragments/ui/button-webs :: buttonWebs}"></th:block>
                <span class="web-button__label">LOG IN</span>
            </button>

            <p class="footer-note">Don't have an account?
                <a th:href="@{/register}">Register</a>
            </p>
            <p class="status" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>
</body>
</html>
