<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome back — WEB EXPRESS</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/pages/register.css}">
    <script type="module" th:src="@{/js/pages/register.js}"></script>
</head>
<body>
<canvas id="cursor-webs" aria-hidden="true"></canvas>

<!-- Decorative SVG shared visually with the registration page. -->
<svg xmlns="http://www.w3.org/2000/svg" class="svg-definitions" aria-hidden="true">
    <defs>
        <symbol id="button-web" viewBox="0 0 94 56" preserveAspectRatio="none">
            <g fill="none" stroke="currentColor" stroke-width="0.65" stroke-linecap="round">
                <path d="M0 0L92 13M0 0L76 35M0 0L48 56M0 0L18 56"/>
                <path d="M19 3Q15 6 16 8Q11 10 10 12Q5 13 4 14
                         M37 5Q29 11 31 14Q22 17 20 23Q11 24 8 28
                         M56 8Q44 16 46 21Q32 26 30 35Q16 36 12 42
                         M75 11Q59 22 61 28Q44 34 40 47Q22 48 16 55"/>
            </g>
        </symbol>
    </defs>
</svg>

<header class="site-header">
    <nav class="nav" aria-label="Main navigation">
        <a class="brand" th:href="@{/tracking}">WEB EXPRESS</a>
        <span class="divider" aria-hidden="true"></span>
        <a th:href="@{/tracking}">HOME</a>
        <span class="nav-current">WELCOME BACK</span>
    </nav>
</header>

<main class="registration-page">
    <aside class="visual" aria-label="Web Express courier illustration">
        <div class="hanger" role="button" tabindex="0"
             aria-label="Gently swing the courier" title="Give me a little swing">
            <img th:src="@{/images/registration-spider.png}"
                 alt="Spider courier hanging upside down on a web with an EXPRESS package">
        </div>
        <p class="visual-note">YOUR FRIENDLY NEIGHBORHOOD DELIVERY.</p>
    </aside>

    <section class="form-area" aria-labelledby="login-title">
        <div class="title-frame">
            <h1 id="login-title"><span>WELCOME</span> <span>BACK.</span></h1>
        </div>

        <!-- Design preview only: Keycloak will handle real authentication. -->
        <form id="login"
              action="#"
              data-auth-form
              data-prototype-message="This is a design preview. Login will be available after Keycloak integration.">
            <div class="field">
                <label for="email">EMAIL ADDRESS</label>
                <input id="email" type="email" autocomplete="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="password">PASSWORD</label>
                <div class="password">
                    <input id="password" type="password"
                           autocomplete="current-password"
                           placeholder="Enter your password" required>
                    <button class="show" type="button" aria-label="Show password"
                            aria-pressed="false">SHOW</button>
                </div>
            </div>

            <button class="cta" type="submit">
                <svg class="button-web button-web-left" aria-hidden="true"><use href="#button-web"/></svg>
                <svg class="button-web button-web-right" aria-hidden="true"><use href="#button-web"/></svg>
                <span>LOG IN</span>
            </button>

            <p class="footer-note">Don't have an account?
                <a th:href="@{/register}">Register</a>
            </p>
            <p class="status" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>
</body>
</html>
