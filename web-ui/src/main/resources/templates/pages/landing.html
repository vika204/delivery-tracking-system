<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e7d6c2">
    <title th:text="${pageTitle}">WEB EXPRESS — Great Speed. Great Delivery.</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/spider-icon.svg}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components/header.css}">
    <link rel="stylesheet" th:href="@{/css/components/cursor-webs.css}">
    <link rel="stylesheet" th:href="@{/css/pages/landing.css}">

    <script defer th:src="@{/js/components/header.js}"></script>
    <script defer th:src="@{/js/components/cursor-webs.js}"></script>
    <script defer th:src="@{/js/pages/landing.js}"></script>
</head>
<body>
<div aria-hidden="true"><canvas id="cursor-webs"></canvas></div>

<div class="landing-page" id="top">
    <header th:replace="~{fragments/header :: siteHeader}"></header>

    <main class="landing-hero">
        <div class="landing-runner">
            <img th:src="@{/images/landing-courier.webp}"
                 src="/images/landing-courier.webp"
                 alt="Animated superhero courier running with an EXPRESS package">
        </div>

        <div class="landing-rule" aria-hidden="true"></div>

        <p class="landing-eyebrow">
            <span class="landing-dash">–</span>
            COURIER SERVICE, REIMAGINED
            <span class="landing-dash">–</span>
        </p>

        <h1 class="landing-headline">
            <span>WITH GREAT SPEED</span>
            <span class="landing-headline-red">COMES GREAT DELIVERY</span>
        </h1>

        <p class="landing-description">
            Every package caught, wrapped, and saved straight to your door —<br>
            tracked the whole way, no detours, no drama.
        </p>

        <a class="landing-cta web-button" href="/ship" th:href="@{/ship}"
           th:unless="${T(com.delivery.webui.security.AuthenticatedUser).currentHeaderState() == 'COURIER'}">
            <th:block th:replace="~{fragments/ui/button-webs :: buttonWebs}"></th:block>
            <span class="web-button__label">SEND A PACKAGE</span>
        </a>
    </main>
</div>

</body>
</html>
