<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">My parcels — WEB EXPRESS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/spider-icon.svg}">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components/header.css}">
    <link rel="stylesheet" th:href="@{/css/components/cursor-webs.css}">
    <link rel="stylesheet" th:href="@{/css/pages/my-parcels.css}">
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/cursor-webs.js}" defer></script>
</head>
<body>
<canvas id="cursor-webs" aria-hidden="true"></canvas>
<header th:replace="~{fragments/header :: siteHeader(headerState=${headerState})}"></header>

<main class="parcels-page">
    <section aria-label="My parcels">
        <div class="parcel-list" aria-live="polite">
            <article class="parcel-card parcel-state"
                     th:if="${parcelsLoading}">
                <div class="parcel-inner">
                    <h2>LOADING YOUR PARCELS...</h2>
                </div>
            </article>

            <article class="parcel-card parcel-state"
                     th:if="${parcelsError}">
                <div class="parcel-inner">
                    <h2>PARCELS ARE TEMPORARILY UNAVAILABLE.</h2>
                </div>
            </article>

            <th:block th:if="${!parcelsLoading and !parcelsError}">
                <article class="parcel-card"
                         th:each="parcel : ${parcels}">
                    <div class="parcel-inner">
                        <div class="parcel-top">
                            <h2 class="parcel-number"
                                th:classappend="${parcel.delivered()} ? 'special' : ''"
                                th:text="|SHIPMENT #${parcel.shipmentId()}|">
                                SHIPMENT #15
                            </h2>
                            <span class="status"
                                  th:classappend="${parcel.statusClass()}"
                                  th:text="${parcel.statusLabel()}">
                                IN TRANSIT
                            </span>
                        </div>

                        <hr class="dashed-rule">

                        <div class="fields">
                            <div class="field">
                                <span class="field-label">DESTINATION</span>
                                <span class="field-value"
                                      th:text="${parcel.deliveryAddress()}">
                                    Kyiv, Khreshchatyk 12
                                </span>
                            </div>
                            <div class="field">
                                <span class="field-label">COURIER</span>
                                <span class="field-value"
                                      th:text="${parcel.courierName()}">
                                    Andrii Kovalenko
                                </span>
                            </div>
                        </div>

                        <div class="parcel-actions">
                            <a class="btn btn-outline"
                               th:href="@{/my-parcels/{id}(id=${parcel.shipmentId()})}">
                                <span class="btn-label">DETAILS</span>
                            </a>
                            <a class="btn btn-red web-button"
                               th:href="@{/tracking(shipmentId=${parcel.shipmentId()},previewRole='CLIENT')}">
                                <th:block th:replace="~{fragments/ui/button-webs :: buttonWebs}"></th:block>
                                <span class="btn-label web-button__label">TRACK PACKAGE</span>
                            </a>
                        </div>
                    </div>
                </article>

                <article class="parcel-card parcel-state"
                         th:if="${#lists.isEmpty(parcels)}">
                    <div class="parcel-inner">
                        <h2>YOU HAVE NO PARCELS YET.</h2>
                        <p>Your deliveries will appear here.</p>
                        <button type="button" class="btn btn-red web-button" disabled>
                            <th:block th:replace="~{fragments/ui/button-webs :: buttonWebs}"></th:block>
                            <span class="btn-label web-button__label">CREATE A SHIPMENT</span>
                        </button>
                    </div>
                </article>
            </th:block>
        </div>
    </section>
</main>
</body>
</html>
