<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e7d6c2">
    <title th:text="${pageTitle}">Courier Dashboard — WEB EXPRESS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/spider-icon.svg}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:wght@500;600;700;800;900&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components/header.css}">
    <link rel="stylesheet" th:href="@{/css/components/cursor-webs.css}">
    <link rel="stylesheet" th:href="@{/css/pages/courier-dashboard.css}">
    <script defer th:src="@{/js/components/header.js}"></script>
    <script defer th:src="@{/js/components/cursor-webs.js}"></script>
    <script type="module" th:src="@{/js/pages/courier-dashboard.js}"></script>
</head>
<body>
<div aria-hidden="true"><canvas id="cursor-webs"></canvas></div>
<header th:replace="~{fragments/header :: siteHeader(headerState=${headerState})}"></header>
<main class="dashboard">
    <article class="dashboard-card">
        <div class="card-inner">
            <div class="columns">
                <aside class="courier-aside" aria-label="Courier status and work settings">
                    <figure class="portrait">
                        <img th:src="@{/images/courier-dashboard-portrait.webp}"
                             src="/images/courier-dashboard-portrait.webp"
                             alt="Courier portrait"
                             draggable="false">
                        <img class="open-to-work-frame"
                             th:src="@{/images/open-to-work.png}"
                             src="/images/open-to-work.png"
                             alt="Open to work"
                             draggable="false">
                    </figure>
                    <p id="courier-name" class="courier-name">&nbsp;</p>
                    <p class="courier-role">COURIER</p>

                    <div class="aside-overview">
                        <div>
                            <hr class="aside-rule">
                            <span class="aside-label">MY STATUS</span>
                            <div class="status-line">
                                <button id="availability-switch"
                                        class="status-toggle"
                                        type="button"
                                        role="switch"
                                        aria-checked="false"
                                        aria-label="Courier availability"
                                        disabled></button>
                                <span id="availability-text" class="status-label">&mdash;</span>
                            </div>
                        </div>
                    </div>
                </aside>

                <div class="content-column">
                    <section aria-labelledby="offers-title">
                        <div class="block-heading offer-heading">
                            <h2 id="offers-title">DELIVERY OFFER</h2>
                        </div>

                        <div id="offer-card" class="offer-card" hidden>
                            <div class="offer-info">
                                <h3 class="shipment-id">SHIPMENT #<span id="offer-shipment"></span></h3>
                                <p class="address">
                                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                        <path d="M12 2a8 8 0 0 0-8 8c0 5.4 8 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8Zm0 11.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4Z"></path>
                                    </svg>
                                    <span><strong>Pickup:</strong> <span id="offer-pickup"></span></span>
                                </p>
                                <p class="address">
                                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                        <path d="M12 2a8 8 0 0 0-8 8c0 5.4 8 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8Zm0 11.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4Z"></path>
                                    </svg>
                                    <span><strong>Delivery:</strong> <span id="offer-delivery"></span></span>
                                </p>
                                <div class="offer-meta">
                                    <span><strong>Weight:</strong> <span id="offer-weight"></span></span>
                                    <span><strong>Distance:</strong> <span id="offer-distance"></span></span>
                                    <span><strong>Price:</strong> <span id="offer-price"></span></span>
                                    <span><strong>Expires in:</strong> <span id="offer-countdown"></span></span>
                                </div>
                            </div>

                            <div class="offer-buttons">
                                <button class="btn btn-red web-button" type="button" id="accept-offer">
                                    <th:block th:replace="~{fragments/ui/button-webs :: buttonWebs}"></th:block>
                                    <span class="web-button__label">ACCEPT</span>
                                </button>
                                <button class="btn btn-plain" type="button" id="decline-offer">DECLINE</button>
                            </div>
                        </div>

                        <div id="no-offer" class="no-offer">
                            No active delivery offers right now.
                        </div>
                    </section>

                    <section aria-labelledby="deliveries-title">
                        <div class="block-heading deliveries-heading">
                            <h2 id="deliveries-title">ACTIVE DELIVERIES</h2>
                        </div>

                        <div id="deliveries-list"></div>
                        <div id="no-deliveries" class="no-offer">No active deliveries.</div>

                        <template id="delivery-template">
                            <article class="delivery-card">
                                <div>
                                    <h3 class="shipment-id"></h3>
                                    <p class="address">
                                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                            <path d="M12 2a8 8 0 0 0-8 8c0 5.4 8 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8Zm0 11.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4Z"></path>
                                        </svg>
                                        <span><strong>From:</strong> <span class="delivery-from"></span></span>
                                    </p>
                                    <p class="address">
                                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                            <path d="M12 2a8 8 0 0 0-8 8c0 5.4 8 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8Zm0 11.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4Z"></path>
                                        </svg>
                                        <span><strong>To:</strong> <span class="delivery-to"></span></span>
                                    </p>
                                </div>

                                <div class="delivery-action">
                                    <span class="status-chip"></span>
                                    <a class="details-link">
                                        <svg viewBox="0 0 24 24"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="2"
                                             stroke-linecap="round"
                                             stroke-linejoin="round"
                                             aria-hidden="true">
                                            <path d="m9 4 8 8-8 8"></path>
                                        </svg>
                                    </a>
                                </div>
                            </article>
                        </template>
                    </section>

                    <output id="action-notice" class="action-notice" aria-live="polite"></output>
                </div>
            </div>
        </div>
    </article>
</main>
</body>
</html>
