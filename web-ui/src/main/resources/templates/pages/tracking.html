<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle}">WEB EXPRESS</title>

    <!-- Fonts -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">

    <!-- MapLibre -->
    <link rel="stylesheet"
          href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">

    <!-- Shared styles -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components/header.css}">

    <!-- Tracking page styles -->
    <link rel="stylesheet" th:href="@{/css/pages/tracking.css}">
    <link rel="stylesheet" th:href="@{/css/components/tracking-map.css}">
    <link rel="stylesheet" th:href="@{/css/components/tracking-card.css}">
    <link rel="stylesheet" th:href="@{/css/components/tracking-controls.css}">
</head>

<body>

<header th:replace="~{fragments/header :: siteHeader}"></header>

<main class="tracking-page" id="tracking">

    <!-- Heading and search -->

    <div class="tracking-heading">

        <div>
            <p class="tracking-heading__eyebrow">
                — YOUR FRIENDLY NEIGHBORHOOD DELIVERY —
            </p>

            <h1>
                YOUR PACKAGE.<br>
                <span>ON THE MOVE.</span>
            </h1>
        </div>

        <form class="tracking-search"
              th:action="@{/tracking}"
              method="get">

            <input type="text"
                   name="shipmentId"
                   aria-label="Shipment ID"
                   th:value="${trackingInput}"
                   required>

            <button type="submit">
                TRACK PACKAGE
            </button>

        </form>

    </div>

    <p th:if="${errorMessage != null}"
       class="tracking-message"
       role="alert"
       th:text="${errorMessage}">
    </p>
    
    <!-- Map + shipment information -->

    <div class="tracking-layout"
         th:if="${tracking != null}">

        <!-- Interactive map -->

        <section class="tracking-map-panel"
                 aria-label="Courier tracking map">

            <div th:if="${demoMode}"
                 id="live-map"
                 class="tracking-map"
                 aria-label="Interactive courier tracking map"
                 th:attr="data-spider-url=@{/images/spider-courier.webp}">
            </div>

            <div th:unless="${demoMode}"
                 class="tracking-map-placeholder">

                <strong>LIVE GPS NOT CONNECTED YET</strong>

                <p>
                    The shipment status is retrieved from the backend.
                    Live courier coordinates will be added later.
                </p>

            </div>

            <div th:if="${demoMode}"
                 id="map-error"
                 class="tracking-map-panel__error"
                 role="status">
                Loading the map…
            </div>

            <div th:if="${demoMode}"
                 class="tracking-map-panel__top">
                <span class="tracking-map-panel__pill">
                    <span class="tracking-map-panel__dot"></span>
                    DEMO TRACKING
                </span>
            </div>

        </section>

        <!-- Reusable Thymeleaf shipment card -->

        <aside th:replace="~{fragments/tracking/shipment-card :: shipmentCard}">
        </aside>

    </div>
    <!-- Demo playback controls -->

    <div class="tracking-controls"
         th:if="${demoMode}">

    <span>
        DEMO · Test coordinates, not a live courier
    </span>

        <div class="tracking-controls__buttons">

            <button type="button"
                    id="follow"
                    class="tracking-controls__button tracking-controls__button--secondary"
                    aria-pressed="false"
                    disabled>
                FOLLOW COURIER
            </button>

            <button type="button"
                    id="pause"
                    class="tracking-controls__button"
                    disabled>
                PAUSE
            </button>

            <button type="button"
                    id="restart"
                    class="tracking-controls__button tracking-controls__button--secondary"
                    disabled>
                REPLAY
            </button>

            <button type="button"
                    id="overview"
                    class="tracking-controls__button tracking-controls__button--secondary"
                    disabled>
                SHOW ROUTE
            </button>

            <button type="button"
                    id="toggle-3d"
                    class="tracking-controls__button tracking-controls__button--secondary"
                    aria-pressed="true"
                    disabled>
                2D VIEW
            </button>

        </div>

    </div>

    <!-- Playback progress -->

    <div class="tracking-progress"
         th:if="${demoMode}">

        <input type="range"
               id="progress"
               min="0"
               max="1000"
               value="0"
               aria-label="Courier progress along the test route"
               disabled>

        <span id="progress-label"
              class="tracking-progress__label">
        0%
    </span>

    </div>

    <!-- Test GPS data -->

    <details class="tracking-gps"
             th:if="${demoMode}">

        <summary>
            TEST COORDINATES
            <span id="gps-current"
                  class="tracking-gps__current"></span>
        </summary>

        <pre id="coordinates"></pre>

        <button type="button"
                id="download"
                class="tracking-controls__button tracking-controls__button--secondary tracking-gps__download">
            DOWNLOAD COORDINATES
        </button>

    </details>

    <p id="tracking-message"
       class="tracking-message"
       role="status"
       th:if="${demoMode}"></p>
</main>

<!-- MapLibre library -->
<script th:if="${demoMode}"
        src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js">
</script>

<!-- Tracking map -->
<script th:if="${demoMode}"
        type="module"
        th:src="@{/js/demo/tracking-demo.js}">
</script>

</body>
</html>
