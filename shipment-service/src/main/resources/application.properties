spring.application.name=shipment-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Fault injection endpoints (/internal/chaos) for alert testing; keep disabled by default
app.chaos.enabled=${APP_CHAOS_ENABLED:false}

logging.pattern.correlation=[%X{correlationId:-}]

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Outbox Relay
outbox.relay.delay-ms=5000

# Distributed tracing
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# Kafka tracing: traceparent header is injected by producer and extracted by listener
spring.kafka.template.observation-enabled=true

# OTLP trace export
management.tracing.export.otlp.enabled=${OTLP_TRACES_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Metrics are collected by Prometheus
management.otlp.metrics.export.enabled=false