spring.application.name=shipment-service

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Схемою керує Flyway (db/migration); Hibernate лише звіряє її з сутностями.
spring.jpa.hibernate.ddl-auto=validate
# Бази, створені раніше через ddl-auto=update, вважаються версією 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Fault injection endpoints (/internal/chaos) for alert testing; keep disabled by default
app.chaos.enabled=${APP_CHAOS_ENABLED:false}

logging.pattern.correlation=[%X{correlationId:-}]

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Outbox Relay
# Чим менша затримка, тим швидше Dispatch дізнається про забір посилки й скасування
outbox.relay.delay-ms=${OUTBOX_RELAY_DELAY_MS:1000}

# Distributed tracing
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# Kafka tracing: traceparent header is injected by producer and extracted by listener
spring.kafka.template.observation-enabled=true

# OTLP trace export
management.tracing.export.otlp.enabled=${OTLP_TRACES_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Metrics are collected by Prometheus
management.otlp.metrics.export.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Dispatch events (dispatch.events) consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Pricing tariff: basePrice + distanceKm * pricePerKm + weightKg * pricePerKg, then delivery type multiplier.
# Dimensions do not affect the price.
pricing.base-price=${PRICING_BASE_PRICE:50.00}
pricing.price-per-km=${PRICING_PRICE_PER_KM:1.50}
pricing.price-per-kg=${PRICING_PRICE_PER_KG:10.00}
pricing.express-multiplier=${PRICING_EXPRESS_MULTIPLIER:1.5}
pricing.quote-ttl=${PRICING_QUOTE_TTL:15m}

geoapify.api-key=${GEOAPIFY_API_KEY:}
spring.http.clients.imperative.factory=jdk
spring.http.serviceclient.geoapify.base-url=https://api.geoapify.com
spring.http.serviceclient.geoapify.connect-timeout=2s
spring.http.serviceclient.geoapify.read-timeout=3s
spring.kafka.listener.observation-enabled=true
