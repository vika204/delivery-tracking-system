services:

  auth-db:
    image: postgres:${POSTGRES_VERSION}

    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}

    volumes:
      - auth-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - delivery-network


  auth-service:
    build:
      context: ./auth-service

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}

    depends_on:
      auth-db:
        condition: service_healthy

    networks:
      - delivery-network


  shipment-db:
    image: postgres:${POSTGRES_VERSION}

    environment:
      POSTGRES_DB: ${SHIPMENT_DB_NAME}
      POSTGRES_USER: ${SHIPMENT_DB_USER}
      POSTGRES_PASSWORD: ${SHIPMENT_DB_PASSWORD}

    volumes:
      - shipment-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHIPMENT_DB_USER} -d ${SHIPMENT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - delivery-network


  shipment-service:
    build:
      context: ./shipment-service

    ports:
      - "8082:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shipment-db:5432/${SHIPMENT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SHIPMENT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SHIPMENT_DB_PASSWORD}

    depends_on:
      shipment-db:
        condition: service_healthy

    networks:
      - delivery-network


volumes:
  auth-db-data:
  shipment-db-data:


networks:
  delivery-network:
    driver: bridge