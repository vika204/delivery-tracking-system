services:

  auth-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}

    volumes:
      - auth-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - delivery-network


  auth-service:
    restart: unless-stopped
    build:
      context: ./auth-service

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m

    depends_on:
      auth-db:
        condition: service_healthy

    networks:
      - delivery-network


  shipment-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SHIPMENT_DB_NAME}
      POSTGRES_USER: ${SHIPMENT_DB_USER}
      POSTGRES_PASSWORD: ${SHIPMENT_DB_PASSWORD}

    volumes:
      - shipment-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHIPMENT_DB_USER} -d ${SHIPMENT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - delivery-network


  shipment-service:
    restart: unless-stopped
    build:
      context: ./shipment-service

    ports:
      - "127.0.0.1:8082:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shipment-db:5432/${SHIPMENT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SHIPMENT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SHIPMENT_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY}

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m

    depends_on:
      shipment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - delivery-network


  dispatch-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DISPATCH_DB_NAME}
      POSTGRES_USER: ${DISPATCH_DB_USER}
      POSTGRES_PASSWORD: ${DISPATCH_DB_PASSWORD}

    volumes:
      - dispatch-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DISPATCH_DB_USER} -d ${DISPATCH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - delivery-network


  dispatch-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: dispatch-service/Dockerfile

    ports:
      - "127.0.0.1:8083:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dispatch-db:5432/${DISPATCH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DISPATCH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DISPATCH_DB_PASSWORD}
      DISPATCH_COURIER_LOOKUP_ENABLED: ${DISPATCH_COURIER_LOOKUP_ENABLED:-true}
      TRACKING_GRPC_TARGET: "dns:///tracking-service:9090"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m

    depends_on:
      dispatch-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - delivery-network


  tracking-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${TRACKING_DB_NAME}
      POSTGRES_USER: ${TRACKING_DB_USER}
      POSTGRES_PASSWORD: ${TRACKING_DB_PASSWORD}

    volumes:
      - tracking-db-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TRACKING_DB_USER} -d ${TRACKING_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - delivery-network


  tracking-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: tracking-service/Dockerfile

    ports:
      - "127.0.0.1:8084:8080"
      - "127.0.0.1:9094:9090"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://tracking-db:5432/${TRACKING_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${TRACKING_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${TRACKING_DB_PASSWORD}
      SHIPMENT_SERVICE_URL: http://shipment-service:8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_REFLECTION_ENABLED: "true"
      TRACKING_RECORDED_AT_ZONE: "UTC"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m

    depends_on:
      tracking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - delivery-network


  notification-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}

    volumes:
      - notification-db-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - delivery-network


  notification-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: notification-service/Dockerfile

    ports:
      - "127.0.0.1:8085:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/${NOTIFICATION_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRACKING_GRPC_TARGET: "dns:///tracking-service:9090"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m

    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - delivery-network

  web-ui:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      SERVER_PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8080
      SHIPMENT_SERVICE_URL: http://shipment-service:8080
      DISPATCH_SERVICE_URL: http://dispatch-service:8080
      TRACKING_SERVICE_URL: http://tracking-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      TRACKING_GRPC_TARGET: "dns:///tracking-service:9090"
      TRACKING_GRPC_TLS_ENABLED: "false"
      TRACKING_STREAM_ENABLED: ${TRACKING_STREAM_ENABLED:-true}
      DISPATCH_COURIER_LOOKUP_ENABLED: ${DISPATCH_COURIER_LOOKUP_ENABLED:-true}
      WEB_LOCAL_DEV_LOOPBACK_ONLY: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m
    depends_on:
      auth-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - delivery-network

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    restart: unless-stopped
    container_name: delivery-kafka

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS:  "/var/lib/kafka/data"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - delivery-network


volumes:
  auth-db-data:
  shipment-db-data:
  dispatch-db-data:
  tracking-db-data:
  notification-db-data:
  kafka-data:


networks:
  delivery-network:
    driver: bridge
